
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack Login</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f4f3fb;
            padding: 20px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px #00000012;
        }

        h1 {
            color: #5145b8;
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            color: #777;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 12px 0 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: #5145b8;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            cursor: pointer;
        }

        .alert {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        a {
            color: #5145b8;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Welcome Back</h1>
        <p>Login to continue your learning journey</p>

        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p style="margin-top: 20px; margin-bottom: 0;">
            Need an account?
            <a href="{{ url_for('register') }}">Create one</a>
        </p>

        <p style="margin-top: 15px;">
            <a href="{{ url_for('home') }}">← Back to Welcome Page</a>
        </p>
    </div>
</body>
</html>
