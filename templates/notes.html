<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyTrack Notes</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            margin: 0;
            background: #f4f3fb;
            padding: 30px 20px;
            color: #1f1f2e;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            color: #5145b8;
        }

        .link-btn {
            background: #5145b8;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
        }

        form {
            display: grid;
            gap: 14px;
            margin-bottom: 30px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            width: fit-content;
            background: #5145b8;
            color: white;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .notes-list {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        .note-card {
            background: #faf8ff;
            border: 1px solid #e8e0ff;
            border-radius: 12px;
            padding: 16px;
        }

        .note-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .note-content {
            color: #444;
            white-space: pre-line;
            margin-bottom: 10px;
        }

        .note-meta {
            color: #666;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .delete-btn {
            background: #ffe5e5;
            color: #a12c2c;
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Study Notes</h1>
            <a href="{{ url_for('dashboard') }}" class="link-btn">Back to Dashboard</a>
        </div>

        <form method="POST" action="{{ url_for('notes') }}">
            <label for="note_title"><strong>Note title</strong></label>
            <input type="text" id="note_title" name="note_title" placeholder="Example: Chapter summary" required>

            <label for="content"><strong>What did you learn?</strong></label>
            <textarea id="content" name="content" placeholder="Write your study reflection or key concepts here..." required></textarea>

            <button type="submit">Save Note</button>
        </form>

        <h2>Recent notes</h2>
        {% if notes %}
            <div class="notes-list">
                {% for note in notes %}
                    <div class="note-card">
                        <div class="note-title">{{ note['title'] }}</div>
                        <div class="note-meta">{{ note['created_at'] }}</div>
                        <div class="note-content">{{ note['content'] }}</div>
                        <form method="POST" action="{{ url_for('delete_note', note_id=note['id']) }}">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <p>No notes saved yet.</p>
        {% endif %}
    </div>
</body>
</html>
